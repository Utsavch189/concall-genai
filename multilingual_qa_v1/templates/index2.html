<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AskInsights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'bounce-dots': 'bounceDots 1.4s infinite',
                        'pulse-ring': 'pulseRing 2s infinite',
                        'wave': 'wave 1.5s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        bounceDots: {
                            '0%, 80%, 100%': { transform: 'scale(0)' },
                            '40%': { transform: 'scale(1)' }
                        },
                        pulseRing: {
                            '0%': { transform: 'scale(0.33)', opacity: '1' },
                            '80%, 100%': { transform: 'scale(2.33)', opacity: '0' }
                        },
                        wave: {
                            '0%, 100%': { transform: 'scaleY(1)' },
                            '50%': { transform: 'scaleY(1.5)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes dots {

            0%,
            20% {
                content: '';
            }

            40% {
                content: '.';
            }

            60% {
                content: '..';
            }

            80%,
            100% {
                content: '...';
            }
        }

        .dots::after {
            content: '';
            animation: dots 1.2s infinite steps(1, end);
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 overflow-hidden">
    <!-- Animated Background Particles -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div
            class="absolute top-10 left-10 w-72 h-72 bg-blue-300 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-bounce">
        </div>
        <div class="absolute top-20 right-10 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-bounce"
            style="animation-delay: 2s;"></div>
        <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-bounce"
            style="animation-delay: 4s;"></div>
    </div>

    <div class="flex items-center justify-center min-h-screen p-4 relative z-10">
        <div class="w-full max-w-4xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1
                    class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-blue-600 via-purple-600 to-indigo-600 bg-clip-text text-transparent mb-4">
                    AskInsights
                </h1>
                <p class="text-gray-600 text-lg">Ask me anything stock related query with text or voice</p>
            </div>

            <!-- Chat Container -->
            <div class="bg-white/20 backdrop-blur-lg rounded-3xl shadow-2xl border border-white/30 overflow-hidden">
                <!-- Chat Messages Area -->
                <div id="chatMessages"
                    class="h-96 md:h-[500px] overflow-y-auto p-6 space-y-4 scrollbar-thin scrollbar-thumb-blue-300 scrollbar-track-transparent">
                    <!-- Welcome Message -->
                    <div class="flex items-start space-x-3 animate-fade-in">
                        <div class="flex-shrink-0">
                            <div
                                class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="bg-white/40 backdrop-blur-sm rounded-2xl rounded-tl-md p-4 shadow-lg">
                                <p class="text-gray-800">Hello! I'm your AI assistant. You can ask me questions by
                                    typing or using the microphone button. How can I help you today?</p>
                                <span class="text-xs text-gray-500 mt-2 block">Just now</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Typing Indicator -->
                <div id="typingIndicator" class="hidden px-6 pb-4">
                    <div class="flex items-start space-x-3">
                        <div class="flex-shrink-0">
                            <div
                                class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="flex-1">
                            <div class="bg-white/40 backdrop-blur-sm rounded-2xl rounded-tl-md p-4 shadow-lg">
                                <div class="flex space-x-1">
                                    <div class="w-2 h-2 bg-gray-600 rounded-full animate-bounce-dots"></div>
                                    <div class="w-2 h-2 bg-gray-600 rounded-full animate-bounce-dots"
                                        style="animation-delay: 0.2s;"></div>
                                    <div class="w-2 h-2 bg-gray-600 rounded-full animate-bounce-dots"
                                        style="animation-delay: 0.4s;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="translatingIndicator" class="text-center mt-2 hidden">
                    <span class="loader-dots text-blue-500 text-sm">Translating<span class="dots">...</span></span>
                </div>

                <!-- Input Area -->
                <div class="p-6 border-t border-white/20 bg-white/10 backdrop-blur-sm">
                    <div class="flex items-center space-x-4">
                        <!-- Voice Recording Indicator -->
                        <div id="voiceIndicator" class="hidden flex items-center space-x-2 text-red-500">
                            <div class="flex space-x-1">
                                <div class="w-1 h-8 bg-red-500 rounded-full animate-wave"></div>
                                <div class="w-1 h-6 bg-red-500 rounded-full animate-wave"
                                    style="animation-delay: 0.1s;"></div>
                                <div class="w-1 h-10 bg-red-500 rounded-full animate-wave"
                                    style="animation-delay: 0.2s;"></div>
                                <div class="w-1 h-4 bg-red-500 rounded-full animate-wave"
                                    style="animation-delay: 0.3s;"></div>
                                <div class="w-1 h-7 bg-red-500 rounded-full animate-wave"
                                    style="animation-delay: 0.4s;"></div>
                            </div>
                            <span class="text-sm font-medium">Recording...</span>
                        </div>

                        <!-- Input Field -->
                        <div class="flex-1 relative">
                            <input type="text" id="messageInput" placeholder="Type your question here..."
                                class="w-full px-6 py-4 bg-white/50 backdrop-blur-sm border border-white/30 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-500 text-gray-800 transition-all duration-200" />
                        </div>

                        <!-- Microphone Button -->
                        <button id="micButton"
                            class="relative flex-shrink-0 w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 rounded-full flex items-center justify-center text-white transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-lg">
                            <div class="absolute inset-0 rounded-full bg-blue-500 animate-pulse-ring opacity-0"></div>
                            <svg id="micIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z">
                                </path>
                            </svg>
                            <svg id="stopIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
                            </svg>
                        </button>

                        <!-- Send Button -->
                        <button id="sendButton"
                            class="flex-shrink-0 w-12 h-12 bg-gradient-to-br from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 rounded-full flex items-center justify-center text-white transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Status Message -->
            <div id="statusMessage"
                class="text-center mt-4 text-sm text-gray-600 opacity-0 transition-opacity duration-300"></div>
        </div>
    </div>

    <script type="module" src="static/main.js"></script>
</body>

</html>
